<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU PROFE CARLOS - Plataforma Escolar Multiformato</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-dark: #1e1b4b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            padding: 30px 15px;
            background-color: var(--bg-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--text-dark);
            font-size: 26px;
            font-weight: 800;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 700;
            display: block;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 13px;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-cerrar {
            background-color: #f1f5f9;
            color: #475569;
            margin-top: 15px;
        }

        .btn-cerrar:hover {
            background-color: #e2e8f0;
        }

        .saludo-card {
            background: #e0e7ff;
            border-left: 5px solid var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        #vistaPlataforma {
            display: none;
        }

        #msgError {
            color: #dc2626;
            margin-top: 15px;
            display: none;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>TU PROFE CARLOS</h1>
        <p>Plataforma de Contenidos Académicos Multiformato</p>
    </div>

    <!-- VISTA 1: INICIO DE SESIÓN -->
    <div id="vistaLogin" class="card">
        <h2 style="text-align: center; margin-bottom: 20px; font-size: 18px; color: #1e293b;">Acceso Privado para Docentes</h2>
        <form onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label for="inputUsuario">USUARIO:</label>
                <input type="text" id="inputUsuario" placeholder="Ej: tuprofecarlos" required>
            </div>
            <div class="form-group">
                <label for="inputClave">CONTRASEÑA:</label>
                <input type="password" id="inputClave" placeholder="••••••••" required>
            </div>
            <button type="submit" id="btnIngresar">Ingresar a la Plataforma</button>
            <div id="msgError"></div>
        </form>
    </div>

    <!-- VISTA 2: PANEL PRINCIPAL Y EXPLORADOR DE ARCHIVOS -->
    <div id="vistaPlataforma" class="card">
        <div id="saludoDocente" class="saludo-card"></div>
        
        <div class="form-group">
            <label for="selectGrado">1. Selecciona el Grado:</label>
            <select id="selectGrado" onchange="cargarAsignaturas()">
                <option value="">-- Seleccionar Grado --</option>
                <option value="Grado-1">Grado 1°</option>
                <option value="Grado-2">Grado 2°</option>
                <option value="Grado-3">Grado 3°</option>
            </select>
        </div>

        <div class="form-group">
            <label for="selectAsignatura">2. Selecciona la Asignatura:</label>
            <select id="selectAsignatura" onchange="cargarArchivos()" disabled>
                <option value="">Elige un grado primero...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="selectArchivo">3. Selecciona el Recurso:</label>
            <select id="selectArchivo" onchange="activarBotonVer()" disabled>
                <option value="">Elige una asignatura primero...</option>
            </select>
        </div>

        <button id="btnVer" onclick="mostrarRecurso()" disabled>Abrir / Visualizar Recurso</button>
        <button class="btn-cerrar" onclick="cerrarSesion()">🔒 Cerrar Sesión</button>
    </div>
</div>

<script>
    // ⚠️ COPIA Y PEGA AQUÍ LA URL EXACTA DE TU BACKEND EN RENDER (Sin '/' al final)
    const URL_BACKEND = "https://TU-SERVICIO-EN-RENDER.onrender.com";

    // 1. INICIAR SESIÓN Y VALIDAR MEMBRESÍA
    async function iniciarSesion(e) {
        e.preventDefault();
        
        const usuario = document.getElementById('inputUsuario').value;
        const clave = document.getElementById('inputClave').value;
        const btnIngresar = document.getElementById('btnIngresar');
        const msgError = document.getElementById('msgError');

        msgError.style.display = 'none';
        btnIngresar.disabled = true;
        btnIngresar.textContent = "Verificando acceso...";

        try {
            const res = await fetch(`${URL_BACKEND}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario, clave })
            });

            const data = await res.json();

            if (data.exito) {
                document.getElementById('vistaLogin').style.display = 'none';
                document.getElementById('vistaPlataforma').style.display = 'block';

                const textoVigencia = data.vencimiento === "ilimitado" 
                    ? "Acceso Vitalicio (Ilimitado)" 
                    : `Licencia Activa Hasta: ${data.vencimiento}`;

                document.getElementById('saludoDocente').innerHTML = `
                    <div style="font-size: 16px; font-weight: bold;">¡Bienvenido(a), ${data.nombreDocente}!</div>
                    <div style="font-size: 13px; color: #4338ca; margin-top: 4px;">📌 Estatus: ${textoVigencia}</div>
                `;
            } else {
                msgError.textContent = data.mensaje;
                msgError.style.display = 'block';
            }
        } catch (error) {
            msgError.textContent = "Error de conexión con el servidor. Intente nuevamente.";
            msgError.style.display = 'block';
        } finally {
            btnIngresar.disabled = false;
            btnIngresar.textContent = "Ingresar a la Plataforma";
        }
    }

    // 2. CARGAR ASIGNATURAS DE FORMA DINÁMICA
    function cargarAsignaturas() {
        const grado = document.getElementById('selectGrado').value;
        const selectAsignatura = document.getElementById('selectAsignatura');
        const selectArchivo = document.getElementById('selectArchivo');
        const btnVer = document.getElementById('btnVer');

        selectAsignatura.innerHTML = '<option value="">-- Seleccionar Asignatura --</option>';
        selectArchivo.innerHTML = '<option value="">Elige una asignatura primero...</option>';
        selectArchivo.disabled = true;
        btnVer.disabled = true;

        if (!grado) {
            selectAsignatura.disabled = true;
            return;
        }

        const asignaturas = ["Matematicas", "Lenguaje", "Ciencias"];
        asignaturas.forEach(asig => {
            const opt = document.createElement('option');
            opt.value = asig;
            opt.textContent = asig;
            selectAsignatura.appendChild(opt);
        });

        selectAsignatura.disabled = false;
    }

    // 3. OBTENER ARCHIVOS DESDE GITHUB
    async function cargarArchivos() {
        const grado = document.getElementById('selectGrado').value;
        const asignatura = document.getElementById('selectAsignatura').value;
        const selectArchivo = document.getElementById('selectArchivo');
        const btnVer = document.getElementById('btnVer');

        selectArchivo.innerHTML = '<option value="">Cargando recursos desde GitHub...</option>';
        selectArchivo.disabled = true;
        btnVer.disabled = true;

        if (!asignatura) return;

        const rutaCarpeta = `${grado}/${asignatura}`;

        try {
            const res = await fetch(`${URL_BACKEND}/listar-archivos?carpeta=${rutaCarpeta}`);
            const archivos = await res.json();

            selectArchivo.innerHTML = '<option value="">-- Seleccionar Recurso --</option>';

            if (Array.isArray(archivos) && archivos.length > 0) {
                archivos.forEach(file => {
                    const opt = document.createElement('option');
                    opt.value = file.download_url;
                    opt.textContent = file.name;
                    selectArchivo.appendChild(opt);
                });
                selectArchivo.disabled = false;
            } else {
                selectArchivo.innerHTML = '<option value="">No hay archivos en esta carpeta</option>';
            }
        } catch (error) {
            selectArchivo.innerHTML = '<option value="">Error al obtener recursos</option>';
        }
    }

    // 4. ACTIVAR BOTÓN DE VER RECURSO
    function activarBotonVer() {
        const selectArchivo = document.getElementById('selectArchivo');
        const btnVer = document.getElementById('btnVer');
        btnVer.disabled = !selectArchivo.value;
    }

    // 5. ABRIR O DESCARGAR RECURSO
    function mostrarRecurso() {
        const urlArchivo = document.getElementById('selectArchivo').value;
        if (urlArchivo) {
            window.open(urlArchivo, '_blank');
        }
    }

    // 6. CERRAR SESIÓN
    function cerrarSesion() {
        location.reload();
    }
</script>
</body>
</html>
